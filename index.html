<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Bounce</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --bg-body: #050505;
            --bg-arena: #0c0c0e;
            --border-ui: #1c1c22;
            --text-main: #FFFFFF;
            --text-muted: #A3A3A3;
            --color-primary: #3b82f6;
            --grid-line: #141419;
            --overlay-bg: rgba(5, 5, 5, 0.9);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #F4F4F5;
                --bg-arena: #FFFFFF;
                --border-ui: #E4E4E7;
                --text-main: #18181B;
                --text-muted: #71717A;
                --color-primary: #1d4ed8;
                --grid-line: #E4E4E7;
                --overlay-bg: rgba(255, 255, 255, 0.94);
            }
        }
        body {
            background-color: var(--bg-body); color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;
            overflow: hidden; width: 100vw; height: 100vh; display: flex;
            justify-content: center; align-items: center; user-select: none;
            -webkit-user-select: none; touch-action: none; transition: background-color 0.3s;
        }
        .game-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 10px 15px 45px 15px; box-sizing: border-box; }
        .scoreboard { width: 100%; max-width: 500px; display: flex; justify-content: space-between; margin-bottom: 12px; padding: 0 10px; box-sizing: border-box; z-index: 10; }
        .score-box { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .score-val { color: var(--text-main); font-variant-numeric: tabular-nums; font-size: 16px; margin-left: 4px; }
        #highScoreVal { color: var(--color-primary); text-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
        .canvas-container { position: relative; width: 100%; flex: 1; background-color: var(--bg-arena); overflow: hidden; border-radius: 20px; }
        canvas { display: block; width: 100%; height: 100%; }
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--overlay-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; text-align: center; z-index: 20; }
        h1 { font-size: 32px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -1px; background: linear-gradient(135deg, #3b82f6, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .desc-text { color: var(--text-muted); font-size: 14px; margin: 0 0 28px 0; max-width: 260px; line-height: 1.4; }
        .action-btn { background-color: var(--text-main); border: none; color: var(--bg-body); padding: 16px 44px; border-radius: 30px; font-size: 16px; font-weight: 700; cursor: pointer; }
        @media (min-width: 600px) and (min-height: 600px) {
            .game-wrapper { width: 460px; height: 720px; padding: 15px; }
            .canvas-container { border: 2px solid var(--border-ui); border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); flex: none; height: 620px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="scoreboard">
            <div class="score-box">Score:<span class="score-val" id="currentScoreVal">0</span></div>
            <div class="score-box">Best:<span class="score-val" id="highScoreVal">0</span></div>
        </div>
        <div class="canvas-container" id="arenaBox">
            <canvas id="gameCanvas"></canvas>
            <div class="menu-overlay" id="menuOverlay">
                <h1 id="menuTitle">NEON BOUNCE</h1>
                <p class="desc-text" id="menuDesc">Drag anywhere to glide your ball onto the falling stairs. Avoid the red traps!</p>
                <button class="action-btn" id="startBtn" onclick="initiateGameSession()">Launch Mission</button>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const arena = document.getElementById('arenaBox');
        const overlay = document.getElementById('menuOverlay');
        const menuTitle = document.getElementById('menuTitle');
        const menuDesc = document.getElementById('menuDesc');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('currentScoreVal');
        const highDisplay = document.getElementById('highScoreVal');

        let gameState = "MENU"; let score = 0; let highScore = 0; let animationFrameId;
        const player = { x: 0, y: 0, radius: 11, targetX: 0, vy: 0 };
        let steps = []; 
        // BALANCED: Perfect speed setting to catch the ball comfortably
        let baseSpeed = 4.5; 
        let spawnTimer = 0;

        function dynamicallyScaleGameCanvas() {
            canvas.width = arena.clientWidth * window.devicePixelRatio;
            canvas.height = arena.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            player.y = (canvas.height / window.devicePixelRatio) / 2;
            if (gameState === "MENU") {
                player.x = (canvas.width / window.devicePixelRatio) / 2;
                player.targetX = player.x;
            }
        }
        window.addEventListener('resize', dynamicallyScaleGameCanvas);

        window.addEventListener('DOMContentLoaded', () => {
            dynamicallyScaleGameCanvas();
            const savedRecord = localStorage.getItem('hs_neon_bounce_isolated');
            if (savedRecord) { highScore = parseInt(savedRecord, 10); highDisplay.innerText = highScore; }
        });

        window.addEventListener('touchstart', handleTouchEvents);
        window.addEventListener('touchmove', handleTouchEvents);

        function handleTouchEvents(e) {
            if (gameState !== "PLAYING") return;
            if (e.touches && e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                const currentWidth = canvas.width / window.devicePixelRatio;
                const canvasTouchX = ((e.touches[0].clientX - rect.left) / rect.width) * currentWidth;
                if (!isNaN(canvasTouchX)) {
                    player.targetX = Math.min(Math.max(canvasTouchX, player.radius), currentWidth - player.radius);
                }
            }
        }
        function initiateGameSession() {
            dynamicallyScaleGameCanvas();
            overlay.style.display = 'none';
            gameState = "PLAYING"; score = 0; scoreDisplay.innerText = score;
            steps = []; baseSpeed = 3.8; spawnTimer = 0;
            const currentW = canvas.width / window.devicePixelRatio;
            const currentH = canvas.height / window.devicePixelRatio;
            player.x = currentW / 2; player.targetX = currentW / 2; player.vy = 0; player.y = currentH / 3;
            // WIDER: Large launch platform so you always start completely safe
            steps.push({ x: currentW / 2 - 60, y: currentH / 2, width: 120, height: 12, isTrap: false });
            cancelAnimationFrame(animationFrameId);
            gameLoopEngineTick();
        }

        function triggerGameOverSequence() {
            gameState = "GAMEOVER"; cancelAnimationFrame(animationFrameId);
            if (score > highScore) { highScore = score; highDisplay.innerText = highScore; localStorage.setItem('hs_neon_bounce_isolated', highScore.toString()); }
            menuTitle.innerText = "MISSION FAILED"; menuTitle.style.background = "linear-gradient(135deg, #ef4444, #fca5a5)"; menuTitle.style.webkitBackgroundClip = "text";
            menuDesc.innerText = `Final Score: ${score}`; startBtn.innerText = "Try Again"; overlay.style.display = 'flex';
        }

        function gameLoopEngineTick() {
            if (gameState !== "PLAYING") return;
            const w = canvas.width / window.devicePixelRatio; const h = canvas.height / window.devicePixelRatio;
            spawnTimer++;

            const styles = getComputedStyle(document.documentElement);
            ctx.fillStyle = styles.getPropertyValue('--bg-arena').trim(); ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = styles.getPropertyValue('--grid-line').trim(); ctx.lineWidth = 1;
            for (let i = 0; i < w; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }

            if (isNaN(player.x)) player.x = w / 2;
            player.x += (player.targetX - player.x) * 0.25;
            player.vy += 0.28; player.y += player.vy;

            // BALANCED: Spawns an endless stream of stairs so you always have a landing target
            if (spawnTimer % 12 === 0) {
                let stepWidth = Math.max(70, 95 - score * 0.25);
                steps.push({ x: Math.random() * (w - stepWidth), y: -15, width: stepWidth, height: 12, isTrap: Math.random() < 0.15 && score > 15 });
            }

            for (let i = steps.length - 1; i >= 0; i--) {
                let step = steps[i]; step.y += baseSpeed;
                ctx.fillStyle = step.isTrap ? "#ef4444" : (styles.getPropertyValue('--color-primary').trim() || "#3b82f6");
                ctx.beginPath(); ctx.roundRect(step.x, step.y, step.width, step.height, 6); ctx.fill();

                if (player.vy > 0 && player.x >= step.x && player.x <= step.x + step.width && player.y + player.radius >= step.y && player.y - player.radius <= step.y + step.height) {
                    if (step.isTrap) { triggerGameOverSequence(); return; }
                    // JUMP HEIGHT: Tuned to a perfect -13 for massive airtime without leaving the field view
                    player.vy = -13; player.y = step.y - player.radius; score++; scoreDisplay.innerText = score;
                    if (score % 10 === 0) baseSpeed += 0.2;
                }
                if (step.y > h) steps.splice(i, 1);
            }

            ctx.fillStyle = styles.getPropertyValue('--text-main').trim();
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();

            if (player.y - player.radius > h || player.y < -120) { triggerGameOverSequence(); return; }
            animationFrameId = requestAnimationFrame(gameLoopEngineTick);
        }
    </script>
</body>
</html>
